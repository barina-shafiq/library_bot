<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Finder Bot</title>
    <!-- Modern Typography: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="header-icon" aria-hidden="true">
                    <!-- Book Icon -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                        <path d="M6 6h10"/>
                        <path d="M6 10h10"/>
                    </svg>
                </div>
                <div class="header-info">
                    <h1 class="header-title">Library Book Finder Bot</h1>
                    <div class="header-status">
                        <span class="status-dot"></span>
                        <span class="status-text">Catalog Assistant &bull; Online</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button type="button" id="newChatBtn" class="new-chat-btn" title="Start a fresh conversation">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                        <path d="M3 21v-5h5"/>
                    </svg>
                    <span>New chat</span>
                </button>
            </div>
        </header>

        <!-- Scrollable Messages Area -->
        <main class="chat-messages" id="chatMessages" role="log" aria-live="polite">
            <!-- Dynamically populated by static/chat.js -->
        </main>

        <!-- Input Footer -->
        <footer class="chat-footer">
            <form id="chatForm" class="chat-form" autocomplete="off">
                <input
                    type="text"
                    id="messageInput"
                    class="message-input"
                    placeholder="Ask about books, check availability, or reserve..."
                    required
                />
                <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
                    <span>Send</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Client Script -->
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
